<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky: Дети Света — Гайды и Галерея</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(180deg, #000428 0%, #004e92 50%, #000428 100%); color: #fff; overflow-x: hidden; }
        header { text-align: center; padding: 2rem; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        h1 { font-family: 'Orbitron', monospace; font-size: 3rem; background: linear-gradient(45deg, #ffd700, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav { display: flex; justify-content: center; gap: 2rem; padding: 1rem; }
        nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border-radius: 20px; transition: all 0.3s; }
        nav a:hover { background: rgba(255,215,0,0.3); box-shadow: 0 0 20px #ffd700; }
        section { padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        #gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s; }
        #gallery img:hover { transform: scale(1.05); box-shadow: 0 20px 40px rgba(255,215,0,0.5); }
        .guide { margin-bottom: 2rem; }
        details { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 1rem; margin-bottom: 1rem; cursor: pointer; }
        summary { font-weight: 600; font-size: 1.3rem; }
        ol { padding-left: 2rem; margin-top: 1rem; }
        li { margin-bottom: 0.5rem; }
        footer { text-align: center; padding: 2rem; background: rgba(0,0,0,0.8); }
        @media (max-width: 768px) { h1 { font-size: 2rem; } nav { flex-direction: column; } }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 2s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>

    <div class="stars" id="stars"></div>
